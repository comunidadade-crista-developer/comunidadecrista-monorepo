services:
  postgres:
    image: postgres:16-alpine
    container_name: comunidade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: comunidade
      POSTGRES_PASSWORD: comunidade_dev
      POSTGRES_DB: comunidade_dev
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunidade -d comunidade_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: comunidade-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
